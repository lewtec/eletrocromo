name: Autorelease

on:
  push:
    branches:
      - main
    # Do not trigger on tags: release pushes a tag, which would re-enter this
    # workflow and mint another version.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_version:
        description: "New tag version"
        type: choice
        default: "patch"
        options:
          - next
          - patch
          - minor
          - major
  schedule:
    - cron: "0 2 * * 6" # saturday 2am

jobs:
  autorelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      tag: ${{ steps.ship.outputs.tag }}
    steps:
      # Full history + tags required: svu needs existing tags to bump correctly.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup git config
        run: |
          git config user.name actions-bot
          git config user.email actions-bot@users.noreply.github.com

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install
        run: mise run install

      - name: CI
        run: mise run ci

      - name: Create Pull Request if there is new stuff from updaters
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8
        id: pr_create
        with:
          commit-message: "chore: updater script changes"
          branch: updater-bot
          delete-branch: true
          title: "Updater: stuff changed"
          body: |
            Changes caused from update scripts

      - name: Stop if a pull request was created
        if: github.event_name != 'pull_request'
        env:
          PR_NUMBER: ${{ steps.pr_create.outputs.pull-request-number }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            echo "The update scripts changed something and a PR was created. Giving up deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Make release if everything looks right
        if: github.event_name == 'workflow_dispatch'
        id: ship
        env:
          NEW_VERSION: ${{ github.event.inputs.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Existing tags (top):"
          git tag --sort=-v:refname | head -10 || true
          echo "svu current=$(svu current 2>/dev/null || true) next=$(svu next) minor=$(svu minor) patch=$(svu patch)"
          TAG="$(svu "$NEW_VERSION")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mise run release -- "$NEW_VERSION"

      - name: Set up JDK 17
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build and upload example APKs
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise run release:examples:android
          gh release upload "${{ steps.ship.outputs.tag }}" dist/examples/*.apk --clobber

  examples-apple:
    if: github.event_name == 'workflow_dispatch'
    needs: autorelease
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.autorelease.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install
        run: mise run install

      - name: Build and upload example Apple apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise run release:examples:apple
          gh release upload "${{ needs.autorelease.outputs.tag }}" dist/examples/*.zip --clobber

  release-checksums:
    if: github.event_name == 'workflow_dispatch' && always() && needs.autorelease.result == 'success'
    needs: [autorelease, examples-apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refresh checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.autorelease.outputs.tag }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir "$tmpdir"
          rm -f "$tmpdir/checksums.txt"
          (cd "$tmpdir" && sha256sum * | LC_ALL=C sort) > checksums.txt
          gh release upload "$TAG" checksums.txt --clobber --repo "${{ github.repository }}"
