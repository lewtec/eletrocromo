[tools]
"github:lucasew/workspaced" = "0.15.2"
go = "1.27.1"
golangci-lint = "2.13.1"
goreleaser = "2.17.0"
svu = "3.3.0"
xcodegen = "2.46.0"

[tasks]
"install:go" = "go mod download"
"install:examples" = """
go -C examples/basic mod download
go -C examples/counter mod download
go -C examples/ticker mod download
go -C examples/inbox mod download
go -C examples/astro mod download
"""
install = { depends = ["install:*"] }
lint = "workspaced codebase lint --review"
fmt = "workspaced codebase format"
"test:go" = "go test -v ./..."
test = { depends = ["test:*"] }
"codegen:go" = "go generate ./..."
codegen = { depends = ["codegen:*"] }
"check:goreleaser" = "goreleaser check"
check = { depends = ["check:*"] }
ci = { depends = ["lint", "test", "check"] }

# Local binary (same package as releases).
"build:cli" = "go build -o bin/eletrocromo ./cmd/eletrocromo"

"icons" = "go run ./cmd/eletrocromo build icons --refresh-icons"

# Dogfood host resolve + Helium --app (Ctrl+C to quit).
"example:basic" = "go -C examples/basic run ."
"example:counter" = "go -C examples/counter run ."
"example:ticker" = "go -C examples/ticker run ."
"example:inbox" = "go -C examples/inbox run ."

# Astro + orvalho: tools/tasks live in examples/astro/mise.toml
"example:astro:build" = "mise -C examples/astro run build"
"example:astro" = "mise -C examples/astro run run"

# Release extras: desktop archives come from GoReleaser; these tasks build
# the packaging targets (APK / .app) and are invoked by Autorelease only.
[tasks."linux:run"]
description = "Cross-compile a Linux binary (GOOS=linux) and run it when this machine is Linux"
usage = '''
arg "<config>" help="Path to eletrocromo.json"
'''
run = '''
go run ./cmd/eletrocromo run --goos linux "${usage_config}"
'''

[tasks."windows:run"]
description = "Cross-compile a Windows exe (GOOS=windows). GOARCH defaults to this machine"
usage = '''
arg "<config>" help="Path to eletrocromo.json"
'''
run = '''
go run ./cmd/eletrocromo run --goos windows "${usage_config}"
'''

[tasks."mac:run"]
description = "Build a macOS .app and open it"
usage = '''
arg "<config>" help="Path to eletrocromo.json"
'''
run = '''
go run ./cmd/eletrocromo run --goos darwin "${usage_config}"
'''

[tasks."ios:run"]
description = "Build an iOS Simulator .app, install it, and launch it"
usage = '''
arg "<config>" help="Path to eletrocromo.json"
'''
run = '''
go run ./cmd/eletrocromo run --goos ios "${usage_config}"
'''

[tasks."android:run"]
description = "Build a debug APK, install it on the connected device, and launch it"
tools = { java = "temurin-17", android-sdk = "19.0", gradle = "8.9" }
usage = '''
arg "<config>" help="Path to eletrocromo.json"
'''
run = '''
go run ./cmd/eletrocromo run --goos android "${usage_config}"
'''

[tasks."release:examples:android"]
description = "Debug APKs for every example (ANDROID_HOME, JDK 17, Gradle 8.9+)"
tools = { gradle = "8.9" }
run = '''
mkdir -p dist/examples
for name in basic counter ticker astro; do
  go run ./cmd/eletrocromo build --goos android \
    "examples/${name}/eletrocromo.json" \
    --out "dist/examples/example-${name}-debug.apk" \
    --workdir "dist/android-${name}"
done
'''

[tasks."release:examples:apple"]
description = "Unsigned macOS and iOS Simulator .app zips for every example (macOS + Xcode)"
run = '''
if [ "$(uname -s)" != "Darwin" ]; then
  echo "release:examples:apple needs macOS and Xcode" >&2
  exit 1
fi
mkdir -p dist/examples
for name in basic counter ticker astro; do
  go run ./cmd/eletrocromo build --goos darwin \
    "examples/${name}/eletrocromo.json" \
    --out "dist/examples/example-${name}.app" \
    --workdir "dist/macos-${name}"
  ditto -c -k --keepParent \
    "dist/examples/example-${name}.app" \
    "dist/examples/example-${name}_macOS.app.zip"

  go run ./cmd/eletrocromo build --goos ios \
    "examples/${name}/eletrocromo.json" \
    --out "dist/examples/example-${name}-ios.app" \
    --workdir "dist/ios-${name}"
  ditto -c -k --keepParent \
    "dist/examples/example-${name}-ios.app" \
    "dist/examples/example-${name}_iOS-simulator.app.zip"
done
'''

# Nested table must come after flat [tasks] keys.
[tasks.release]
description = "Tag and ship self-contained binaries with GoReleaser (svu + goreleaser)"
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
git tag "$TAG"
# Ensure the tag is on the remote before goreleaser publishes GitHub artifacts
git push origin "refs/tags/$TAG"
goreleaser release --clean
'''
